# DISABLED on the droid mirror.
#
# Production for policestationrepuk.org is owned by
# robertcashman-bit/Policestationrepuk (see docs/deploy.md there).
# This mirror previously shared VERCEL_* secrets and promoted droid SHAs
# over bit, restoring removed features (e.g. lead-magnet spam).
#
# Do not re-enable. Deploy only from the bit repo.
name: Deploy to Vercel (production)

on:
  workflow_dispatch:
    inputs:
      confirm_disabled:
        description: 'This workflow is disabled — production deploys from robertcashman-bit only'
        required: true
        type: string

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deploy from droid mirror
        run: |
          echo "Production deploys are disabled on robertdavidcashman-droid/Policestationrepuk."
          echo "Use robertcashman-bit/Policestationrepuk (npm run deploy / Deploy to Vercel workflow)."
          exit 1
