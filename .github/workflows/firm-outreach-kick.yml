# Firm outreach production kick.
#
# Auto: after a successful production deploy, if the deployed SHA touches
# firm-outreach paths (including this workflow), pull prod env and kick
# status → enrich → send flush (both campaigns).
# Manual: workflow_dispatch with sha + confirm_kick=KICK.
name: Firm outreach production kick

on:
  workflow_run:
    workflows:
      - Deploy to Vercel (production)
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git commit SHA that was verified (for audit trail)'
        required: true
        type: string
      confirm_kick:
        description: 'Type KICK to confirm production outreach kick'
        required: true
        type: string

jobs:
  should-kick:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'master' ||
        github.event.workflow_run.head_branch == 'main')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.confirm_kick == 'KICK')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to kick
        id: decide
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRM_OUTREACH_BOOTSTRAP_SECRET: ${{ secrets.FIRM_OUTREACH_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] && [ -z "${CRON_SECRET:-}" ] && [ -z "${FIRM_OUTREACH_BOOTSTRAP_SECRET:-}" ]; then
            echo "No VERCEL_TOKEN or cron auth secrets — skipping kick"
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.event.inputs.sha }}"
            echo "Manual KICK for ${SHA}"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="${{ github.event.workflow_run.head_sha }}"
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "Invalid deploy SHA: ${SHA}"
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "$SHA" --depth=2
          PARENT="$(git rev-parse "${SHA}^" 2>/dev/null || true)"
          if [ -z "$PARENT" ] || [ "$PARENT" = "$SHA" ]; then
            echo "No parent commit for ${SHA} — kicking anyway (outreach deploy)"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$PARENT" "$SHA" | grep -qE '^(lib/firm-outreach|app/api/cron/firm-outreach|packages/firm-outreach-core|scripts/firm-outreach|\.github/workflows/firm-outreach-kick\.yml)'; then
            echo "Firm-outreach changes in ${SHA} — will kick"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No firm-outreach changes in ${SHA} — skipping kick"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  kick:
    needs: should-kick
    if: needs.should-kick.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI (pinned)
        run: npm install -g vercel@41.4.0

      - name: Pull production env
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            vercel env pull .env.production --environment=production --yes --token=${{ secrets.VERCEL_TOKEN }}
          else
            echo "VERCEL_TOKEN not set — using GitHub secrets for cron auth only"
          fi

      - name: Requalify + enrich + send flush on production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRM_OUTREACH_BOOTSTRAP_SECRET: ${{ secrets.FIRM_OUTREACH_BOOTSTRAP_SECRET }}
        run: |
          set -a
          if [ -f .env.production ]; then
            # shellcheck disable=SC1091
            source .env.production
          fi
          set +a
          export FIRM_OUTREACH_KICK_BASE_URL="https://policestationrepuk.org"
          export VERCEL_TOKEN="${{ secrets.VERCEL_TOKEN }}"
          export FIRM_OUTREACH_KICK_COMMIT_SHA="${{ needs.should-kick.outputs.sha }}"
          # Status + bootstrap enrich, then optional /api/cron/firm-outreach-send
          # (both campaigns; needs CRON_SECRET from GH secret or pulled .env.production).
          node scripts/firm-outreach-production-kick.mjs
